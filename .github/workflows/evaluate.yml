name: Evaluate RAG Pipeline

# Triggered on changes to core pipeline code
on:
  push:
    paths: ['backend/app/core/**']
  pull_request:
    paths: ['backend/app/core/**']

env:
  PYTHON_VERSION: '3.11'

jobs:
  evaluate:
    name: Pipeline Evaluation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Java (for tabula-py)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pipeline evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: scientific-papers-ci
          PINECONE_CLOUD: gcp
          PINECONE_REGION: us-central1
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          python -c "
          import asyncio
          import json
          import sys
          sys.path.insert(0, '.')

          from app.config import config
          from app.services.llm_service import init_llm, init_embed_model, init_judge_llm, configure_settings
          from app.core.document_parser import collect_all_documents
          from app.core.chunking import run_optimized_ingestion_pipeline
          from app.core.indexing import create_pinecone_index
          from app.core.retrieval import create_query_engine
          from app.core.evaluation import evaluate_retrievers, evaluate_rag_quality

          async def main():
              # Init models
              config.validate()
              llm = init_llm()
              judge_llm = init_judge_llm()
              embed_model = init_embed_model()
              configure_settings(llm, embed_model)

              # Step 1-3: Parse + Chunk + Index
              print('Step 1: Parsing test PDF...')
              docs = collect_all_documents('../attention_is_all_you_need.pdf')
              print(f'Parsed {len(docs)} documents')

              print('Step 2: Chunking + Embedding...')
              nodes = run_optimized_ingestion_pipeline(docs, embed_model)
              print(f'Created {len(nodes)} nodes')

              print('Step 3: Indexing to Pinecone (CI namespace)...')
              index = create_pinecone_index(nodes, embed_model, namespace='ci_eval')

              # Step 4-5: Retriever evaluation
              print('Step 4: Generating QA pairs + Retriever evaluation...')
              retriever_metrics = await evaluate_retrievers(index, nodes, llm)

              # Step 6: RAG quality evaluation
              print('Step 5: RAG quality evaluation...')
              engine = create_query_engine(index, nodes, llm)
              rag_metrics = await evaluate_rag_quality(engine, judge_llm, '../data/eval/transformer_gold_qa_50.txt')

              # Output results
              results = {
                  'retriever_metrics': [
                      {'name': m.retriever_name, 'mrr': m.mrr, 'hit_rate': m.hit_rate,
                       'precision': m.precision, 'recall': m.recall}
                      for m in retriever_metrics
                  ],
                  'rag_quality': {
                      'faithfulness': rag_metrics.avg_faithfulness,
                      'relevancy': rag_metrics.avg_relevancy,
                  }
              }
              print(json.dumps(results, indent=2))

              # Gate: check thresholds
              hybrid = next((m for m in retriever_metrics if m.retriever_name == 'hybrid'), None)
              if hybrid and hybrid.hit_rate < 0.80:
                  print(f'❌ GATE FAILED: Hybrid Hit Rate {hybrid.hit_rate:.3f} < 0.80')
                  sys.exit(1)
              if rag_metrics.avg_relevancy < 0.85:
                  print(f'❌ GATE FAILED: Relevancy {rag_metrics.avg_relevancy:.3f} < 0.85')
                  sys.exit(1)
              print('✅ All quality gates passed!')

          asyncio.run(main())
          "

      - name: Cleanup Pinecone CI namespace
        if: always()
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: scientific-papers-ci
        run: |
          cd backend
          python -c "
          from pinecone import Pinecone
          import os
          pc = Pinecone(api_key=os.getenv('PINECONE_API_KEY'))
          idx = pc.Index(os.getenv('PINECONE_INDEX_NAME'))
          try:
              idx.delete(delete_all=True, namespace='ci_eval')
              print('Cleaned up CI namespace')
          except:
              pass
          "
