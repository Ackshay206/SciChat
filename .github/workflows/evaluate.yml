name: Evaluate RAG Pipeline

# Triggered on changes to core pipeline code
on:
  push:
    paths: ['backend/app/core/**']
  pull_request:
    paths: ['backend/app/core/**']

env:
  PYTHON_VERSION: '3.11'

jobs:
  evaluate:
    name: Pipeline Evaluation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > backend/.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> backend/.env
          echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}" >> backend/.env
          echo "PINECONE_INDEX_NAME=scientific-papers-ci" >> backend/.env
          echo "PINECONE_CLOUD=aws" >> backend/.env
          echo "PINECONE_REGION=us-east-1" >> backend/.env
          echo "REDIS_URL=redis://localhost:6379" >> backend/.env

      - name: Run pipeline evaluation (MLflow)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: scientific-papers-ci
          PINECONE_CLOUD: aws
          PINECONE_REGION: us-east-1
          REDIS_URL: redis://localhost:6379
          EVAL_PDF_PATH: ../data/attention_is_all_you_need.pdf
          EVAL_QA_PATH: ../data/eval/transformer_gold_qa_50.txt
          MLFLOW_TRACKING_URI: mlruns
        run: |
          cd backend
          python -m scripts.run_evaluation

      - name: Upload MLflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results
          path: |
            backend/mlruns/
            backend/eval_results.json
          retention-days: 30

      - name: Cleanup Pinecone CI namespace
        if: always()
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: scientific-papers-ci
        run: |
          cd backend
          python -c "
          from pinecone import Pinecone
          import os
          pc = Pinecone(api_key=os.getenv('PINECONE_API_KEY'))
          idx = pc.Index(os.getenv('PINECONE_INDEX_NAME'))
          try:
              idx.delete(delete_all=True, namespace='ci_eval')
              print('Cleaned up CI namespace')
          except:
              pass
          "
